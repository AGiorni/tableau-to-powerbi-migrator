[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "t2pbi"
version = "0.0.1"
description = "AI-assisted migrator from Tableau workbooks (.twb/.twbx) to Power BI projects (.pbip)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.2",
    "pydantic>=2.7",
    # 0.6 introduced context_schema / Runtime, which the migration graph is built on.
    "langgraph>=0.6",
    "langchain-core>=0.3",
    # create_agent and its middleware run the refinement agent (t2pbi.refine.agent).
    "langchain>=1.0",
    "langchain-openai>=0.1.20",
    "azure-identity>=1.17",
    # Reads local settings and secrets from a gitignored .env file (see .env.example).
    "python-dotenv>=1.0",
    # Client for Microsoft's Power BI Authoring MCP server (t2pbi.desktop); tested with 1.30 and 2.3.
    "mcp>=1.30,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]
# Unpack the data a packaged workbook (.twbx) carries: Tableau's Hyper API reads its extracts.
extract = [
    "tableauhyperapi>=0.0.26963",
]
# Traces in a local Arize Phoenix (T2PBI_PHOENIX=true; scripts/phoenix_server.py).
trace = [
    "arize-phoenix>=22",
    "arize-phoenix-otel>=0.17",
    "openinference-instrumentation-langchain>=0.1.90",
]

[project.scripts]
t2pbi = "t2pbi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/t2pbi"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
